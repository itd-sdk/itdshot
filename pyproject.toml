[project]
name = "itdshot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.1",
    "imageio-ffmpeg>=0.6.0",
    "itd-sdk[captcha]>=2.10.1",
    "jinja2>=3.1.6",
    "pillow>=12.2.0",
    "playwright>=1.62.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]

[project.scripts]
itdshot = "itdshot.cli:post_screenshot"

[build-system]
requires = ['uv_build==0.11']
build-backend = 'uv_build'

[tool.uv.build-backend]
module-name = 'itdshot'
module-root = ''
